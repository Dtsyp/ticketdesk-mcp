[project]
name = "ticketdesk-mcp"
version = "0.1.0"
# Pinned to 3.12 to match the runtime image; mcp/pydantic have no 3.14 wheels
# yet. Runtime deps live in requirements.txt (source of truth for CI/Docker).
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
